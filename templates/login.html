<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriFly - Login</title>
    <link rel="stylesheet" href="../static/css/variables.css">
    <link rel="stylesheet" href="../static/css/pages/login.css">
    <!-- Fontes Archivo e Barlow -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <main class="login-card">
        <header class="card-header">
            <img src="../static/images/logofundoazul.jpg" alt="Logo VeriFly" class="logo">
        </header>

    
        <div class="card-body">
            <h1 class="title">SEJA BEM VINDO AO VERIFLY!</h1>
            <p class="subtitle">Sistema de monitoramento de voos</p>

            <form id="login-form" action="/api/auth/login" method="POST">
                <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
                <input type="hidden" name="next" value="{{ next_page }}">
                <p id="login-feedback" role="alert" hidden></p>
                <div class="form-group">
                    <label for="usuario">Usuário</label>
                    <input type="email" id="usuario" name="email" autocomplete="username" maxlength="254" placeholder="atendente@agencia.com.br" required>
                </div>

                
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="password-wrapper">
                        <input type="password" id="senha" name="password" autocomplete="current-password" maxlength="256" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-eye" aria-label="Mostrar senha" aria-pressed="false">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                
                {% if turnstile_site_key %}
                <div class="cloudflare-card">
                    <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-theme="light"></div>
                </div>
                {% endif %}

                <button type="submit" class="btn-submit">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <span data-submit-label>ENTRAR</span>
                </button>
            </form>

            <footer class="card-footer">
                {% if turnstile_site_key %}Protegido por Cloudflare · {% endif %}VeriFly © 2026
            </footer>
        </div>
    </main>

    {% if turnstile_site_key %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    {% endif %}
    <script src="../static/scripts/login.js"></script>
</body>
</html>
