<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../static/css/variables.css">
    <link rel="stylesheet" href="../static/css/components/menu.css">
    <link rel="stylesheet" href="../static/css/pages/new_reserve.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="../static/images/favicon.ico">

    <title>Verifly - Nova reserva</title>
    <link rel="stylesheet" href="../static/css/components/top_menu.css">
</head>

<body>
    <div id="app-container">

        <div id="left-menu">
            <button id="close-left-menu"><img src="../static/images/x-button.png"></button>
            <img src="../static/images/logo_verifly_bg_blue.jpg" class="main-logo">
            <nav>
                <a href="dashboard.html"><img src="../static/images/dashboard.png">Dashboard</a>
                <a href="new_reserve.html" class="active"><img src="../static/images/nova-reserva.png">Nova Reserva</a>
                <a href="history.html"><img src="../static/images/historico.png">Histórico</a>
            </nav>
        </div>

        {% set menu_show_search = false %}
        {% include "_top_menu.html" %}

        <main id="page-content">

            <form id="new-reserve-form" action="#" method="POST">

                <section id="identification-container" class="form-card" aria-labelledby="identification-heading">
                    <h2 class="section-title" id="identification-heading">IDENTIFICAÇÃO</h2>

                    <div class="identification-grid">
                        <div class="form-group">
                            <label for="client-name">NOME DO CLIENTE</label>
                            <input type="text" id="client-name" name="client_name" placeholder="João Carlos" required>
                        </div>

                        <div class="form-group">
                            <label for="reserve-pnr">CÓDIGO DA RESERVA (PNR)</label>
                            <input type="text" id="reserve-pnr" name="reserve_pnr" placeholder="ABC123D" maxlength="10"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="client-phone">TELEFONE DO CLIENTE</label>
                            <input type="tel" id="client-phone" name="client_phone" placeholder="(11) 98765-4321"
                                required>
                        </div>

                        <div class="form-group folder-group">
                            <label for="folder">PASTA</label>
                            <input type="text" id="folder" name="folder" placeholder="4039" required>
                        </div>
                    </div>
                </section>

                <section id="itinerary-container" class="form-card" aria-labelledby="itinerary-heading">
                    <header class="itinerary-top">
                        <h2 class="section-title" id="itinerary-heading">ITINERÁRIO (MULTITRECHOS)</h2>
                        <button type="button" class="btn-add-segment" id="btn-add-segment">+ Adicionar trecho</button>
                    </header>

                    <div id="segments-list">
                        <div class="segment">
                            <div class="segment-top">
                                <span class="segment-tag">TRECHO 1</span>
                            </div>

                            <div class="segment-row segment-row-flight">
                                <div class="form-group">
                                    <label>ORIGEM</label>
                                    <input type="text" name="origin" placeholder="CNF" maxlength="3" required>
                                </div>

                                <div class="form-group">
                                    <label>DESTINO</label>
                                    <input type="text" name="destination" placeholder="MCZ" maxlength="3" required>
                                </div>

                                <div class="form-group">
                                    <label>TIPO</label>
                                    <select name="type" required>
                                        <option value="" selected disabled>Selecione</option>
                                        <option value="domestic">Doméstico</option>
                                        <option value="international">Internacional</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>PARTIDA ORIGINAL</label>
                                    <input type="datetime-local" name="departure_date" required>
                                </div>

                                <div class="form-group">
                                    <label>CHEGADA ORIGINAL</label>
                                    <input type="datetime-local" name="arrival_date" required>
                                </div>
                            </div>

                            <div class="segment-row segment-row-airline">
                                <div class="form-group">
                                    <label>COMPANHIA AÉREA</label>
                                    <select name="airline" required>
                                        <option value="" selected disabled>SELECIONE</option>
                                        <option value="azul">Azul</option>
                                        <option value="latam">LATAM</option>
                                        <option value="gol">GOL</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label>URL DA RESERVA</label>
                                    <input type="url" name="reserve_url"
                                        placeholder="https://companhia.com.br/reserva/ABC123D">
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="form-actions">
                    <button type="submit" class="btn-register">Cadastrar e Monitorar</button>
                    <small>O monitoramento compara os horários originais com o status atual da companhia.</small>
                </div>

            </form>

        </main>
    </div>

    <script src="../static/scripts/top_menu.js"></script>
    <script src="../static/scripts/new_reserve.js"></script>
    <script src="../static/scripts/open-close-LeftMenu.js"></script>
</body>

</html>
